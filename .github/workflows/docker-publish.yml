name: Build and Publish to Docker Hub

# Replaces "docker build + docker push" on a laptop. GitHub runs it instead.
on:
  push:
    branches: [main]
    paths:
      - 'serving/**'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:        # lets you run it by hand from the Actions tab

env:
  # The Docker Hub namespace is not secret, so it lives here rather than in a
  # secret. One less value that can be pasted with a stray newline.
  DOCKERHUB_USER: naderi11
  IMAGE_NAME: titanic-survival-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        env:
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          # Secrets pasted through a browser often pick up a trailing newline,
          # which makes Docker build a malformed Authorization header.
          CLEAN_TOKEN=$(printf '%s' "$TOKEN" | tr -d '[:space:]')
          if [ -z "$CLEAN_TOKEN" ]; then
            echo "DOCKERHUB_TOKEN is empty" >&2
            exit 1
          fi
          printf '%s' "$CLEAN_TOKEN" | docker login -u "$DOCKERHUB_USER" --password-stdin

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_USER }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=v1.0
            type=sha,format=short

      - name: Build the image and load it for testing
        uses: docker/build-push-action@v6
        with:
          context: ./serving
          load: true            # keep it local first so the smoke test can run
          push: false
          tags: ${{ env.IMAGE_NAME }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the container
        run: |
          docker run -d --name api -p 8000:8000 ${{ env.IMAGE_NAME }}:test

          # Wait for the app to come up
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/ > /dev/null; then break; fi
            sleep 2
          done

          echo "--- health ---"
          curl -sf http://localhost:8000/ | tee /tmp/health.json
          grep -q '"model_loaded":true' /tmp/health.json

          echo "--- prediction ---"
          curl -sf -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"Pclass":1,"Sex":"female","Age":30.0,"SibSp":0,"Parch":0,"Fare":100.0,"Embarked":"C"}' \
            | tee /tmp/pred.json
          grep -q '"survived"' /tmp/pred.json

          # Assert the exact response contract, not just a 200.
          # A renamed or missing field must fail the build, not the review.
          for field in survived survival_probability prediction_confidence passenger_profile; do
            grep -q "\"$field\"" /tmp/pred.json || { echo "MISSING FIELD: $field" >&2; exit 1; }
          done

          echo "--- batch prediction ---"
          curl -sf -X POST http://localhost:8000/predict-batch \
            -H "Content-Type: application/json" \
            -d '[{"Pclass":1,"Sex":"female","Age":30.0,"SibSp":0,"Parch":0,"Fare":100.0,"Embarked":"C"}]' \
            | tee /tmp/batch.json
          grep -q '"prediction_confidence"' /tmp/batch.json
          grep -q '"count"' /tmp/batch.json

          docker rm -f api

      - name: Push to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: ./serving
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Pushed to Docker Hub" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "Pull it with: docker pull $DOCKERHUB_USER/$IMAGE_NAME:latest" >> $GITHUB_STEP_SUMMARY
